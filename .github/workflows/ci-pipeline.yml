name: Enterprise Healthcare Lakehouse CI/CD & HIPAA Compliance Gate

on:
  push:
    branches:
      - main
      - staging
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - staging
      - develop

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-hipaa-gate:
    name: Lint, Typecheck, HIPAA Audit & 100% Coverage (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies
        run: uv sync --frozen --dev || uv sync --dev

      - name: Verify Zero Raw Clinical PHI or KMS Keys in Repository
        run: |
          uv run python -c "
          import subprocess, sys
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          forbidden = [f for f in tracked if f.endswith(('.csv', '.hl7', '.mllp', '.fhir.json', '.pem', '.key'))]
          if forbidden:
              sys.exit(f'HIPAA REPOSITORY GATE FAILED: Forbidden clinical/secret files tracked: {forbidden}')
          print('HIPAA Repository File Audit Passed: 0 forbidden clinical or key files tracked.')
          "

      - name: Run Ruff Code Formatter Check
        run: uv run ruff format --check src tests scripts

      - name: Run Ruff Linter
        run: uv run ruff check src tests scripts

      - name: Run Mypy Strict Static Type Checker
        run: uv run mypy src tests scripts

      - name: Validate Docker Compose Specification (compose.yaml)
        run: docker compose -f compose.yaml config -q

      - name: Run Pytest Unit & Integration Suite (100% Coverage Gate)
        run: uv run pytest --cov=src/healthcare_lakehouse --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=100

      - name: Execute End-to-End Medallion Pipeline & HIPAA Safe Harbor Verification
        run: |
          uv run healthcare-lakehouse run-pipeline \
            --patients 12 \
            --seed 42 \
            --output-dir /tmp/ci-lakehouse-verify \
            --verify-hipaa
