[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "healthcare-lakehouse"
version = "1.0.0"
description = "Enterprise Healthcare Clinical Interoperability Medallion Lakehouse (HL7 v2 / FHIR R4 Streams with HIPAA Safe Harbor De-Identification, KMS Tokenization & NEWS2 Clinical Scoring)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Principal Forward-Deployed Data Engineer" }
]
keywords = [
    "healthcare",
    "hl7",
    "fhir",
    "lakehouse",
    "hipaa",
    "medallion-architecture",
    "synthea",
    "pyarrow",
    "parquet",
    "data-engineering",
]
dependencies = [
    "pydantic>=2.9.0",
    "pyarrow>=18.0.0",
]

[project.scripts]
healthcare-lakehouse = "healthcare_lakehouse.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "lefthook>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/healthcare_lakehouse"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = ["src"]
packages = ["healthcare_lakehouse"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/healthcare_lakehouse",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]

[tool.coverage.run]
source = ["src/healthcare_lakehouse"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
